name: podman-example
runtime: yaml
description: Exercise the Podman provider against a local engine (see README.md in this folder).

plugins:
  providers:
    - name: podman
      path: ../..

resources:
  demoVolume:
    type: podman:volumes:Volume
    properties:
      name: pulumi-podman-demo
      labels:
        managed-by: pulumi
