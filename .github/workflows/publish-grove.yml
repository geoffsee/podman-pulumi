name: publish-grove

# Publish the provider archives and language SDKs to Grove.
# Requires the GROVE_API_KEY repository secret (a grv_ API token).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pulumi/setup-pulumi@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10"

      - uses: oras-project/setup-oras@v1
        with:
          version: "1.2.3"

      - name: Publish to Grove
        env:
          GROVE_API_KEY: ${{ secrets.GROVE_API_KEY }}
          GROVE_URL: https://grove.gsio.dev
        run: bash scripts/publish-grove.sh
