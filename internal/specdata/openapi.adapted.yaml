                type: string
        type: object
        x-go-package: go.podman.io/podman/v6/pkg/domain/entities/types
    ArtifactPullProgress:
        description: |-
            Populated when streaming is enabled, image status is "pulling",
            and there is pull progress to report.
        properties:
            current:
                description: |-
                    Current is the number of bytes of the current artifact that have been
                    transferred so far.
                    Populated when artifact status is "pulling" or "success".
                format: uint64
                type: integer
                x-go-name: Current
            progressComponentID:
                description: |-
                    ProgressComponentID is the unique identifier for the artifact being pulled.
                    A value of "" indicates that the progress component ID is unknown.
                type: string
                x-go-name: ProgressComponentID
            status:
                $ref: '#/definitions/ArtifactPullStatus'
            total:
                description: |-
                    Total is the total size of the artifact in bytes. A value of -1
                    indicates that the total size is unknown.
                    Populated when artifact status is "pulling" or "success".
                format: int64
                type: integer
                x-go-name: Total
        title: Information about the progress of the artifact pull.
        type: object
        x-go-package: go.podman.io/podman/v6/pkg/domain/entities/types
    ArtifactPullReport:
        properties:
            ArtifactDigest:
                $ref: '#/definitions/Digest'
        type: object
        x-go-package: go.podman.io/podman/v6/pkg/domain/entities/types
    ArtifactPullStatus:
        type: string
        x-go-package: go.podman.io/podman/v6/pkg/domain/entities/types
    ArtifactPushReport:
        properties:
            ArtifactDigest:
                $ref: '#/definitions/Digest'
        type: object
        x-go-package: go.podman.io/podman/v6/pkg/domain/entities/types
    ArtifactRemoveReport:
        properties:
            ArtifactDigests:
                items:
                    $ref: '#/definitions/Digest'
                type: array
        type: object
        x-go-package: go.podman.io/podman/v6/pkg/domain/entities/types
    ArtifactVolume:
        description: |-
            ArtifactVolume is a volume based on a artifact. The artifact blobs will
            be bind mounted directly as files and must always be read only.
        properties:
            destination:
                description: |-
                    Destination is the absolute path of the mount in the container.
                    If path is a file in the container, then the artifact must consist of a single blob.
                    Otherwise if it is a directory or does not exists all artifact blobs will be mounted
                    into this path as files. As name the "org.opencontainers.image.title" will be used if
                    available otherwise the digest is used as name.
                type: string
                x-go-name: Destination
            digest:
                description: |-
                    Digest can be used to filter a single blob from a multi blob artifact by the given digest.
                    When this option is set the file name in the container defaults to the digest even when
                    the title annotation exist.
                    Optional. Conflicts with Title.
                type: string
                x-go-name: Digest
            name:
                description: |-
                    Name is the name that should be used for the path inside the container. When a single blob
                    is mounted the name is used as is. If multiple blobs are mounted then mount them as
                    "<name>-x" where x is a 0 indexed integer based on the layer order.
                    Optional.
                type: string
                x-go-name: Name
            source:
                description: Source is the name or digest of the artifact that should be mounted
                type: string
                x-go-name: Source
            title:
                description: |-
                    Title can be used for multi blob artifacts to only mount the one specific blob that
                    matches the "org.opencontainers.image.title" annotation.
                    Optional. Conflicts with Digest.
                type: string
                x-go-name: Title
        type: object
        x-go-package: go.podman.io/podman/v6/pkg/specgen
    AttestationProperties:
        properties:
