info:
    contact:
        email: podman@lists.podman.io
        name: Podman
        url: https://podman.io/community
    description: 'REST-shaped view of the Podman Libpod API, generated for the Pulumi provider. Upstream: https://docs.podman.io/en/latest/_static/api.html'
    license:
        name: Apache-2.0
        url: https://opensource.org/licenses/Apache-2.0
    termsOfService: https://github.com/containers/podman/blob/913caaa9b1de2b63692c9bae15120208194c9eb3/LICENSE
    title: Podman Libpod API
    version: 6.0.0
    x-logo:
        - url: https://raw.githubusercontent.com/podman-container-tools/podman/main/logo/podman-logo.png
        - altText: Podman logo
paths:
    /artifacts:
        post:
            description: Pull an OCI artifact from a remote registry to local storage.
            operationId: ArtifactPullLibpod
            parameters:
                - description: |
                    base-64 encoded auth config.
                    Must include the following four values: username, password, email and server address
                    OR simply just an identity token.
                  in: header
                  name: X-Registry-Auth
                  type: string
                - in: body
                  name: create
                  required: true
                  schema:
                    properties:
                        name:
                            description: Mandatory reference to the artifact (e.g., quay.io/image/artifact:tag)
                            type: string
                        retry:
                            description: Number of times to retry in case of failure when performing pull
                            type: integer
                        retryDelay:
                            description: Delay between retries in case of pull failures (e.g., 10s)
                            type: string
                        tlsVerify:
                            description: Require TLS verification
                            type: boolean
                    required:
                        - name
                    type: object
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/artifactPullResponse'
                "400":
                    $ref: '#/responses/badParamError'
                "401":
                    $ref: '#/responses/artifactBadAuth'
                "404":
                    $ref: '#/responses/artifactNotFound'
                "500":
                    $ref: '#/responses/internalError'
            summary: Pull an artifact
            tags:
                - artifacts
    /artifacts/{id}:
        delete:
            description: Remove a single artifact from local storage by name or ID.
            operationId: ArtifactDeleteLibpod
            parameters:
                - description: Name or ID of the artifact to remove
                  in: path
                  name: id
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/artifactRemoveResponse'
                "404":
                    $ref: '#/responses/artifactNotFound'
                "500":
                    $ref: '#/responses/internalError'
            summary: Remove an artifact
            tags:
                - artifacts
        get:
            description: |
                Retrieve detailed information about a specific OCI artifact by name or ID.
            operationId: ArtifactInspectLibpod
            parameters:
                - description: Name or ID of the artifact
                  in: path
                  name: id
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/inspectArtifactResponse'
                "404":
                    $ref: '#/responses/artifactNotFound'
                "500":
                    $ref: '#/responses/internalError'
            summary: Inspect an artifact
            tags:
                - artifacts
    /containers:
        post:
            operationId: ContainerCreateLibpod
            parameters:
                - description: attributes for creating a container
                  in: body
                  name: create
                  required: true
                  schema:
                    $ref: '#/definitions/SpecGenerator'
            produces:
                - application/json
            responses:
                "201":
                    $ref: '#/responses/containerCreateResponse'
                "400":
                    $ref: '#/responses/badParamError'
                "404":
                    $ref: '#/responses/containerNotFound'
                "409":
                    $ref: '#/responses/conflictError'
                "500":
                    $ref: '#/responses/internalError'
            summary: Create a container
            tags:
                - containers
    /containers/{id}:
        delete:
            description: Delete container
            operationId: ContainerDeleteLibpod
            parameters:
                - description: the name or ID of the container
                  in: path
                  name: id
                  required: true
                  type: string
                - description: additionally remove containers that depend on the container to be removed
                  in: query
                  name: depend
                  type: boolean
                - description: force stop container if running
                  in: query
                  name: force
                  type: boolean
                - description: ignore errors when the container to be removed does not existxo
                  in: query
                  name: ignore
                  type: boolean
                - default: 10
                  description: number of seconds to wait before killing container when force removing
                  in: query
                  name: timeout
                  type: integer
                - description: delete volumes
                  in: query
                  name: v
                  type: boolean
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/containerRemoveLibpod'
                "204":
                    description: no error
                "400":
                    $ref: '#/responses/badParamError'
                "404":
                    $ref: '#/responses/containerNotFound'
                "409":
                    $ref: '#/responses/conflictError'
                "500":
                    $ref: '#/responses/internalError'
            summary: Delete container
            tags:
                - containers
        get:
            description: Return low-level information about a container.
            operationId: ContainerInspectLibpod
            parameters:
                - description: the name or ID of the container
                  in: path
                  name: id
                  required: true
                  type: string
                - description: display filesystem usage
                  in: query
                  name: size
                  type: boolean
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/containerInspectResponseLibpod'
                "404":
                    $ref: '#/responses/containerNotFound'
                "500":
                    $ref: '#/responses/internalError'
            summary: Inspect container
            tags:
                - containers
    /images:
        post:
            description: Pull one or more images from a container registry. Error status codes can come either from the API or from the registry. Errors may be detected later even if the HTTP status 200 is returned, and in that case, the error description will be in the `error` field.
            operationId: ImagePullLibpod
            parameters:
                - description: 'base-64 encoded auth config. Must include the following four values: username, password, email and server address OR simply just an identity token.'
                  in: header
                  name: X-Registry-Auth
                  type: string
                - in: body
                  name: create
                  required: true
                  schema:
                    properties:
                        Arch:
                            description: Pull image for the specified architecture.
                            type: string
                        OS:
                            description: Pull image for the specified operating system.
                            type: string
                        Variant:
                            description: Pull image for the specified variant.
                            type: string
                        allTags:
                            description: Pull all tagged images in the repository.
                            type: boolean
                        compatMode:
                            description: Return the same JSON payload as the Docker-compat endpoint. Cannot be used with 'pullProgress' or 'quiet'.
                            type: boolean
                        policy:
                            description: Pull policy, "always" (default), "missing", "newer", "never".
                            type: string
                        pullProgress:
                            description: Send reports about the progress of the pull. Cannot be used with 'compatMode' or 'quiet'.
                            type: boolean
                        quiet:
                            description: Silence extra stream data on pull. Cannot be used with 'compatMode' or 'pullProgress'.
                            type: boolean
                        reference:
                            description: Mandatory reference to the image (e.g., quay.io/image/name:tag)
                            type: string
                        tlsVerify:
                            description: Require TLS verification.
                            type: boolean
                    required: []
                    type: object
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/imagesPullResponseLibpod'
                "400":
                    $ref: '#/responses/badParamError'
                "500":
                    $ref: '#/responses/internalError'
                default:
                    $ref: '#/responses/errorFromRegistry'
            summary: Pull images
            tags:
                - images
    /images/{id}:
        delete:
            description: Remove an image from the local storage.
            operationId: ImageDeleteLibpod
            parameters:
                - description: name or ID of image to remove
                  in: path
                  name: id
                  required: true
                  type: string
                - description: remove the image even if used by containers or has other tags
                  in: query
                  name: force
                  type: boolean
                - default: false
                  description: Ignore if a specified image does not exist and do not throw an error.
                  in: query
                  name: ignore
                  type: boolean
                - description: Resolve to a manifest list instead of an image.
                  in: query
                  name: lookupManifest
                  type: boolean
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/imagesRemoveResponseLibpod'
                "400":
                    $ref: '#/responses/badParamError'
                "404":
                    $ref: '#/responses/imageNotFound'
                "409":
                    $ref: '#/responses/conflictError'
                "500":
                    $ref: '#/responses/internalError'
            summary: Remove an image from the local storage.
            tags:
                - images
        get:
            description: Obtain low-level information about an image
            operationId: ImageInspectLibpod
            parameters:
                - description: the name or ID of the container
                  in: path
                  name: id
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/inspectImageResponseLibpod'
                "404":
                    $ref: '#/responses/imageNotFound'
                "500":
                    $ref: '#/responses/internalError'
            summary: Inspect an image
            tags:
                - images
    /networks:
        post:
            description: Create a new network configuration
            operationId: NetworkCreateLibpod
            parameters:
                - description: attributes for creating a network
                  in: body
                  name: create
                  schema:
                    $ref: '#/definitions/networkCreateLibpod'
                - default: false
                  description: Ignore the request if a network with the same name already exists.
                  in: query
                  name: ignoreIfExists
                  type: boolean
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/networkCreateResponse'
                "400":
                    $ref: '#/responses/badParamError'
                "409":
                    $ref: '#/responses/conflictError'
                "500":
                    $ref: '#/responses/internalError'
            summary: Create network
            tags:
                - networks
    /networks/{id}:
        delete:
            description: Remove a configured network
            operationId: NetworkDeleteLibpod
            parameters:
                - description: the name of the network
                  in: path
                  name: id
                  required: true
                  type: string
                - description: remove containers associated with network
                  in: query
                  name: force
                  type: boolean
                - description: ignore if a specified network does not exist
                  in: query
                  name: ignore
                  type: boolean
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/networkRmResponse'
                "404":
                    $ref: '#/responses/networkNotFound'
                "500":
                    $ref: '#/responses/internalError'
            summary: Remove a network
            tags:
                - networks
        get:
            description: |
                Display configuration for a network.
            operationId: NetworkInspectLibpod
            parameters:
                - description: the name of the network
                  in: path
                  name: id
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/networkInspectResponse'
                "404":
                    $ref: '#/responses/networkNotFound'
                "500":
                    $ref: '#/responses/internalError'
            summary: Inspect a network
            tags:
                - networks
        patch:
            description: Update existing podman network
            operationId: NetworkUpdateLibpod
            parameters:
                - description: the name or ID of the network
                  in: path
                  name: id
                  required: true
                  type: string
                - description: attributes for updating a netavark network
                  in: body
                  name: update
                  schema:
                    $ref: '#/definitions/networkUpdateRequestLibpod'
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                "400":
                    $ref: '#/responses/badParamError'
                "500":
                    $ref: '#/responses/internalError'
            summary: Update existing podman network
            tags:
                - networks
    /pods:
        post:
            operationId: PodCreateLibpod
            parameters:
                - description: attributes for creating a pod
                  in: body
                  name: create
                  schema:
                    $ref: '#/definitions/PodSpecGenerator'
            produces:
                - application/json
            responses:
                "201":
                    description: ""
                    schema:
                        $ref: '#/definitions/IDResponse'
                "400":
                    $ref: '#/responses/badParamError'
                "409":
                    description: status conflict
                    schema:
                        description: message describing error
                        type: string
                "500":
                    $ref: '#/responses/internalError'
            summary: Create a pod
            tags:
                - pods
    /pods/{id}:
        delete:
            operationId: PodDeleteLibpod
            parameters:
                - description: the name or ID of the pod
                  in: path
                  name: id
                  required: true
                  type: string
                - description: force removal of a running pod by first stopping all containers, then removing all containers in the pod
                  in: query
                  name: force
                  type: boolean
                - description: number of seconds to wait before killing containers in pod
                  in: query
                  name: timeout
                  type: integer
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/podRmResponse'
                "400":
                    $ref: '#/responses/badParamError'
                "404":
                    $ref: '#/responses/podNotFound'
                "500":
                    $ref: '#/responses/internalError'
            summary: Remove pod
            tags:
                - pods
        get:
            operationId: PodInspectLibpod
            parameters:
                - description: the name or ID of the pod
                  in: path
                  name: id
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/podInspectResponse'
                "404":
                    $ref: '#/responses/podNotFound'
                "500":
                    $ref: '#/responses/internalError'
            summary: Inspect pod
            tags:
                - pods
    /quadlets:
        post:
            consumes:
                - application/x-tar
                - multipart/form-data
            description: |
                Install one or more files for a quadlet application. Each request should contain a single quadlet file
                and optionally more files such as containerfile, kube yaml or configuration files. When additional
                files are passed, the application query parameter should be specified. Supports both tar archives and
                multipart form data uploads.
            operationId: QuadletInstallLibpod
            parameters:
                - in: body
                  name: create
                  required: true
                  schema:
                    properties:
                        application:
                            description: |
                                Group quadlet and associated files in a directory with the application name.
                                Required when additional files are passed.
                            type: string
                        data:
                            description: Raw request body payload.
                            type: string
                        reload-systemd:
                            description: Reload systemd after installing quadlets
                            type: boolean
                        replace:
                            description: Replace the installation files even if the files already exists
                            type: boolean
                    required:
                        - data
                    type: object
            produces:
                - application/json
            responses:
                "200":
                    description: Quadlet installation report
                    schema:
                        properties:
                            InstalledQuadlets:
                                additionalProperties:
                                    type: string
                                description: Map of source path to installed path for successfully installed quadlets
                                type: object
                            QuadletErrors:
                                additionalProperties:
                                    type: string
                                description: Map of source path to error message for failed installations
                                type: object
                        type: object
                "400":
                    $ref: '#/responses/badParamError'
                "500":
                    $ref: '#/responses/internalError'
            summary: Install quadlet files
            tags:
                - quadlets
    /quadlets/{id}:
        delete:
            description: |
                Remove a quadlet file by name. Can force removal of running quadlets and control systemd reload behavior.
            operationId: QuadletDeleteLibpod
            parameters:
                - description: the name of the quadlet with extension (e.g., "myapp.container")
                  in: path
                  name: id
                  required: true
                  type: string
                - default: false
                  description: Remove running quadlets (in case of uninstantiated template quadlets, stop its instances).
                  in: query
                  name: force
                  type: boolean
                - default: false
                  description: Do not error if the quadlet does not exist
                  in: query
                  name: ignore
                  type: boolean
                - default: true
                  description: Reload systemd after removing the quadlet
                  in: query
                  name: reload-systemd
                  type: boolean
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/quadletRemoveResponse'
                "400":
                    $ref: '#/responses/badParamError'
                "404":
                    $ref: '#/responses/quadletNotFound'
                "500":
                    $ref: '#/responses/internalError'
            summary: Remove a quadlet file
            tags:
                - quadlets
    /secrets:
        post:
            operationId: SecretCreateLibpod
            parameters:
                - in: body
                  name: create
                  required: true
                  schema:
                    properties:
                        data:
                            description: Raw request body payload.
                            type: string
                        driver:
                            description: Secret driver
                            type: string
                        driveropts:
                            description: JSON-encoded string containing secret driver options as a `map[string]string`.
                            type: string
                        ignore:
                            description: Ignore the request if a secret with the same name already exists.
                            type: boolean
                        labels:
                            description: JSON-encoded string containing labels as a `map[string]string`.
                            type: string
                        name:
                            description: User-defined name of the secret.
                            type: string
                        replace:
                            description: Replace an existing secret with the same name.
                            type: boolean
                    required:
                        - name
                        - data
                    type: object
            produces:
                - application/json
            responses:
                "201":
                    $ref: '#/responses/SecretCreateResponse'
                "500":
                    $ref: '#/responses/internalError'
            summary: Create a secret
            tags:
                - secrets
    /secrets/{id}:
        delete:
            operationId: SecretDeleteLibpod
            parameters:
                - description: the name or ID of the secret
                  in: path
                  name: id
                  required: true
                  type: string
                - default: false
                  description: Remove all secrets
                  in: query
                  name: all
                  type: boolean
            produces:
                - application/json
            responses:
                "204":
                    description: no error
                "404":
                    $ref: '#/responses/NoSuchSecret'
                "500":
                    $ref: '#/responses/internalError'
            summary: Remove secret
            tags:
                - secrets
        get:
            operationId: SecretInspectLibpod
            parameters:
                - description: the name or ID of the secret
                  in: path
                  name: id
                  required: true
                  type: string
                - default: false
                  description: Display Secret
                  in: query
                  name: showsecret
                  type: boolean
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/SecretInspectResponse'
                "404":
                    $ref: '#/responses/NoSuchSecret'
                "500":
                    $ref: '#/responses/internalError'
            summary: Inspect secret
            tags:
                - secrets
    /volumes:
        post:
            operationId: VolumeCreateLibpod
            parameters:
                - description: attributes for creating a volume
                  in: body
                  name: create
                  schema:
                    $ref: '#/definitions/VolumeCreateOptions'
            produces:
                - application/json
            responses:
                "201":
                    $ref: '#/responses/volumeCreateResponse'
                "500":
                    $ref: '#/responses/internalError'
            summary: Create a volume
            tags:
                - volumes
    /volumes/{id}:
        delete:
            operationId: VolumeDeleteLibpod
            parameters:
                - description: the name or ID of the volume
                  in: path
                  name: id
                  required: true
                  type: string
                - description: force removal
                  in: query
                  name: force
                  type: boolean
                - description: timeout before forcibly killing any containers using the volume
                  in: query
                  name: timeout
                  type: integer
            produces:
                - application/json
            responses:
                "204":
                    description: no error
                "404":
                    $ref: '#/responses/volumeNotFound'
                "409":
                    description: Volume is in use and cannot be removed
                "500":
                    $ref: '#/responses/internalError'
            summary: Remove volume
            tags:
                - volumes
        get:
            operationId: VolumeInspectLibpod
            parameters:
                - description: the name or ID of the volume
                  in: path
                  name: id
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    $ref: '#/responses/volumeCreateResponse'
                "404":
                    $ref: '#/responses/volumeNotFound'
                "500":
                    $ref: '#/responses/internalError'
            summary: Inspect volume
            tags:
                - volumes
