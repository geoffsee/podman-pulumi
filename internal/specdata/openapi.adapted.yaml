                $ref: '#/definitions/TopologyRequirement'
            Availability:
                $ref: '#/definitions/Availability'
            CapacityRange:
                $ref: '#/definitions/CapacityRange'
            Group:
                description: |-
                    Group defines the volume group of this volume. Volumes belonging to the
