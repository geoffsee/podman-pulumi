                type: string
                x-go-name: IdentityToken
            password:
                type: string
                x-go-name: Password
            registrytoken:
                description: RegistryToken is a bearer token to be sent to a registry
                type: string
                x-go-name: RegistryToken
            serveraddress:
                type: string
                x-go-name: ServerAddress
            username:
                type: string
                x-go-name: Username
        type: object
        x-go-package: go.podman.io/podman/v6/pkg/domain/entities/types
    AuthReport:
