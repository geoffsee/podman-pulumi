            ImageName:
                description: Name of the image.
                type: string
            Policy:
                description: The configured auto-update policy.
                type: string
            SystemdUnit:
                description: SystemdUnit running a container configured for auto updates.
                type: string
            Updated:
                description: |-
                    Indicates the update status: true, false, failed, pending (see
